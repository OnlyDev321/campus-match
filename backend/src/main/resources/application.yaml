server:
  port: 8080

spring:
  application:
    name: campus-match-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-late-mode-a1gfpw2c.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:REDACTED_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:REDACTED_JWT_SECRET}
  expiration-ms: 86400000 # 24 Hours
